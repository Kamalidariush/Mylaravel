services:

  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "9000"
    volumes:
      - user_files:/var/www/html/storage/app/private
      - user_files_backups:/backup/user-files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  nginx:
    image: ${NGINX_IMAGE}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - backend

  queue:
    image: ${APP_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    volumes:
      - user_files:/var/www/html/storage/app/private
      - user_files_backups:/backup/user-files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  scheduler:
    image: ${APP_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan schedule:work
    volumes:
      - user_files:/var/www/html/storage/app/private
      - user_files_backups:/backup/user-files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=mkdir -p /backup/wal && test ! -f /backup/wal/%f && cp %p /backup/wal/%f
      - -c
      - archive_timeout=60s
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  user_files:
  postgres_backups:
  user_files_backups:

networks:
  backend:
    name: myproject_backend
    external: true