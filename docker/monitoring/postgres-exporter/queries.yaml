long_running_queries:
  query: |
    SELECT
      count(*) AS long_running_queries
    FROM pg_stat_activity
    WHERE state <> 'idle'
      AND query_start IS NOT NULL
      AND now() - query_start > interval '5 minutes';
  metrics:
    - long_running_queries:
        usage: "GAUGE"
        description: "Number of queries running longer than 5 minutes"

waiting_sessions:
  query: |
    SELECT
      count(*) AS waiting_sessions
    FROM pg_stat_activity
    WHERE wait_event IS NOT NULL
      AND state <> 'idle';
  metrics:
    - waiting_sessions:
        usage: "GAUGE"
        description: "Number of sessions waiting on a PostgreSQL event"

blocked_queries:
  query: |
    SELECT
      count(*) AS blocked_queries
    FROM pg_stat_activity AS waiting
    JOIN pg_locks AS waiting_lock
      ON waiting_lock.pid = waiting.pid
     AND NOT waiting_lock.granted
    JOIN pg_locks AS holding_lock
      ON holding_lock.locktype = waiting_lock.locktype
     AND holding_lock.database IS NOT DISTINCT FROM waiting_lock.database
     AND holding_lock.relation IS NOT DISTINCT FROM waiting_lock.relation
     AND holding_lock.page IS NOT DISTINCT FROM waiting_lock.page
     AND holding_lock.tuple IS NOT DISTINCT FROM waiting_lock.tuple
     AND holding_lock.virtualxid IS NOT DISTINCT FROM waiting_lock.virtualxid
     AND holding_lock.transactionid IS NOT DISTINCT FROM waiting_lock.transactionid
     AND holding_lock.classid IS NOT DISTINCT FROM waiting_lock.classid
     AND holding_lock.objid IS NOT DISTINCT FROM waiting_lock.objid
     AND holding_lock.objsubid IS NOT DISTINCT FROM waiting_lock.objsubid
     AND holding_lock.pid <> waiting_lock.pid
     AND holding_lock.granted
    WHERE waiting.state <> 'idle';
  metrics:
    - blocked_queries:
        usage: "GAUGE"
        description: "Number of sessions blocked by another session"