[global]
repo1-path=/backup/pgbackrest
repo1-retention-full=3
repo1-retention-diff=7

repo1-type=posix
compress-type=zst
compress-level=3

start-fast=y
process-max=2

log-level-console=info
log-level-file=detail

log-path=/var/log/pgbackrest

[myproject]
pg1-host=postgres
pg1-port=5432
pg1-user=postgres
pg1-database=myproject