
# 00 - Store non-sensitive Laravel environment variables.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mylaravel.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "mylaravel.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  # 01 - Render application settings from values.yaml.
  {{- range $key, $value := .Values.app.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}