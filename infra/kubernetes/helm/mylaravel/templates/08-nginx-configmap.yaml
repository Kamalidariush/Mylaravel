# 08 - Configure Nginx for Kubernetes.
# File: infra/kubernetes/helm/mylaravel/templates/08-nginx-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mylaravel.fullname" . }}-nginx-config
  labels:
    {{- include "mylaravel.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
data:
  default.conf: |
    server {
        listen 80;
        listen [::]:80;

        server_name _;

        root /var/www/html/public;
        index index.php index.html;

        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;

            fastcgi_pass {{ include "mylaravel.fullname" . }}-app:{{ .Values.service.app.port }};
            fastcgi_index index.php;

            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
