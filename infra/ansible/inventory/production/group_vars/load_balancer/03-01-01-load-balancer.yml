---
# Shared configuration for all dedicated HAProxy load balancers.
#
# These servers are NOT Kubernetes nodes.
# They only provide Kubernetes API high availability.

# ---------------------------------------------------------
# HAProxy
# ---------------------------------------------------------

haproxy_image: "haproxy:3.2"

haproxy_deploy_dir: "/opt/haproxy"

haproxy_api_port: 6443

# ---------------------------------------------------------
# Kubernetes API backend
# ---------------------------------------------------------

kubernetes_api_vip: "192.168.1.101"

kubernetes_api_port: 6443

kubernetes_control_plane_nodes:
  - name: k8s-1
    address: 192.168.1.134
    port: 6443

  - name: k8s-2
    address: 192.168.1.135
    port: 6443

  - name: k8s-3
    address: 192.168.1.136
    port: 6443

# ---------------------------------------------------------
# Keepalived / VRRP
# ---------------------------------------------------------

keepalived_vip: "192.168.1.101"
keepalived_vip_cidr: "192.168.1.101/24"

keepalived_router_id: 51
