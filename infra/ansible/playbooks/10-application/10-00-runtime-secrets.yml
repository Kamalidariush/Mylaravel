---
# 10-00-runtime-secrets.yml
# Path: infra/ansible/playbooks/10-application/10-00-runtime-secrets.yml
# Purpose: Reconcile Laravel runtime credentials from Kubernetes Secrets
#          and Ansible Vault without printing secret values.

- name: "Laravel | Manage runtime Secret"
  hosts: k8s-1
  become: false
  gather_facts: false

  vars_files:
    - vars/10-00-01-runtime-secrets.vault.yml

  vars:
    app_namespace: "production"
    app_secret: "mylaravel-runtime"

    postgres_namespace: "database"
    postgres_secret: "postgres-app"

    redis_namespace: "cache"
    redis_secret: "redis"

    s3_namespace: "object-storage"
    s3_secret: "laravel-s3-secret"

  tasks:
    - name: "Laravel | Validate APP_KEY from Ansible Vault"
      ansible.builtin.assert:
        that:
          - laravel_app_key is defined
          - laravel_app_key is match('^base64:[A-Za-z0-9+/]+=*$')
        fail_msg: "Ansible Vault must contain a valid Laravel APP_KEY."
      no_log: true

    - name: "Laravel | Read PostgreSQL username"
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          kubectl -n {{ postgres_namespace }}
          get secret {{ postgres_secret }}
          -o jsonpath='{.data.username}' | base64 --decode
        executable: /bin/bash
      register: postgres_username
      changed_when: false
      no_log: true

    - name: "Laravel | Read PostgreSQL password"
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          kubectl -n {{ postgres_namespace }}
          get secret {{ postgres_secret }}
          -o jsonpath='{.data.password}' | base64 --decode
        executable: /bin/bash
      register: postgres_password
      changed_when: false
      no_log: true

    - name: "Laravel | Read Redis password"
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          kubectl -n {{ redis_namespace }}
          get secret {{ redis_secret }}
          -o jsonpath='{.data.redis-password}' | base64 --decode
        executable: /bin/bash
      register: redis_password
      changed_when: false
      no_log: true

    - name: "Laravel | Read S3 access key"
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          kubectl -n {{ s3_namespace }}
          get secret {{ s3_secret }}
          -o jsonpath='{.data.accessKey}' | base64 --decode
        executable: /bin/bash
      register: s3_access_key
      changed_when: false
      no_log: true

    - name: "Laravel | Read S3 secret key"
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          kubectl -n {{ s3_namespace }}
          get secret {{ s3_secret }}
          -o jsonpath='{.data.secretKey}' | base64 --decode
        executable: /bin/bash
      register: s3_secret_key
      changed_when: false
      no_log: true

    - name: "Laravel | Validate source credentials"
      ansible.builtin.assert:
        that:
          - postgres_username.stdout | length > 0
          - postgres_password.stdout | length > 0
          - redis_password.stdout | length > 0
          - s3_access_key.stdout | length > 0
          - s3_secret_key.stdout | length > 0
        fail_msg: >-
          A required source credential is missing or empty.
          Check the source Secret names and key names.
      no_log: true

    - name: "Laravel | Apply runtime Secret"
      ansible.builtin.shell:
        cmd: |
          set -o pipefail

          kubectl -n "$APP_NAMESPACE" create secret generic "$APP_SECRET" \
            --from-literal=APP_KEY="$APP_KEY" \
            --from-literal=DB_USERNAME="$DB_USERNAME" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=REDIS_PASSWORD="$REDIS_PASSWORD" \
            --from-literal=AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            --from-literal=AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
            --dry-run=client -o yaml |
          kubectl apply -f -
        executable: /bin/bash
      environment:
        APP_NAMESPACE: "{{ app_namespace }}"
        APP_SECRET: "{{ app_secret }}"
        APP_KEY: "{{ laravel_app_key }}"
        DB_USERNAME: "{{ postgres_username.stdout }}"
        DB_PASSWORD: "{{ postgres_password.stdout }}"
        REDIS_PASSWORD: "{{ redis_password.stdout }}"
        AWS_ACCESS_KEY_ID: "{{ s3_access_key.stdout }}"
        AWS_SECRET_ACCESS_KEY: "{{ s3_secret_key.stdout }}"
      register: runtime_secret_apply
      changed_when: >-
        'created' in runtime_secret_apply.stdout or
        'configured' in runtime_secret_apply.stdout
      no_log: true

    - name: "Laravel | Verify runtime Secret exists"
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - "{{ app_namespace }}"
          - get
          - secret
          - "{{ app_secret }}"
          - -o
          - name
      register: runtime_secret_verify
      changed_when: false

    - name: "Laravel | Report result"
      ansible.builtin.debug:
        msg: >-
          Runtime Secret {{ app_secret }} exists in namespace
          {{ app_namespace }}. Secret values were not displayed.
