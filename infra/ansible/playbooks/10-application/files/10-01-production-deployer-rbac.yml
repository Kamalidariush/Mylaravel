# File: 10-01-production-deployer-rbac.yml
# Path: infra/ansible/playbooks/10-application/files/10-01-production-deployer-rbac.yml
# Purpose: Namespace-scoped permissions for Helm production releases.

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: production-deployer
  namespace: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: production-deployer
  namespace: production
rules:
  # Helm release metadata is stored in Secrets.
  - apiGroups: [""]
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Application resources managed by the Helm chart.
  - apiGroups: [""]
    resources:
      - services
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Ingress resources, if included in the chart.
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: production-deployer
  namespace: production
subjects:
  - kind: ServiceAccount
    name: production-deployer
    namespace: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: production-deployer