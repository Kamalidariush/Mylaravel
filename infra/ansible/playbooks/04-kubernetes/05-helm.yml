---
# 05-helm.yml
#
# Install Helm on the first Kubernetes control-plane node.
#
# Target:
# - k8s-1
#
# Purpose:
# - Provide Helm as the Kubernetes package manager.
# - Helm will be used later for:
#     * Cilium
#     * Ingress Controller
#     * Longhorn
#     * CloudNativePG
#     * Redis
#     * Monitoring
#     * Loki
#     * Tempo
#
# IMPORTANT:
# - Helm is installed only on k8s-1.
# - Other Kubernetes nodes do not need Helm.
# - The installation is version-pinned for reproducibility.

- name: "Kubernetes | 05 | Install Helm"
  hosts: k8s-1
  become: true
  gather_facts: true

  vars:

    # ---------------------------------------------------------
    # Helm version
    # ---------------------------------------------------------
    #
    # Pin the version so infrastructure deployments remain
    # reproducible.
    #
    # Change this value only when intentionally upgrading Helm.
    #

    helm_version: "v4.3.0"

    helm_architecture: "amd64"

    helm_download_url: >-
      https://get.helm.sh/helm-{{ helm_version }}-linux-{{ helm_architecture }}.tar.gz

    helm_install_directory: "/usr/local/bin"

    helm_binary_path: "/usr/local/bin/helm"

    helm_archive_path: "/tmp/helm-{{ helm_version }}-linux-{{ helm_architecture }}.tar.gz"

  tasks:

    # ---------------------------------------------------------
    # Check existing Helm installation
    # ---------------------------------------------------------

    - name: "Helm | Check installed version"
      ansible.builtin.command:
        cmd: "{{ helm_binary_path }} version --short"
      register: helm_existing_version
      changed_when: false
      failed_when: false

    # ---------------------------------------------------------
    # Download Helm
    # ---------------------------------------------------------

    - name: "Helm | Download Helm archive"
      ansible.builtin.get_url:
        url: "{{ helm_download_url }}"
        dest: "{{ helm_archive_path }}"
        mode: "0644"
      when:
        - helm_existing_version.rc != 0
          or helm_version not in helm_existing_version.stdout

    # ---------------------------------------------------------
    # Create temporary extraction directory
    # ---------------------------------------------------------

    - name: "Helm | Create extraction directory"
      ansible.builtin.file:
        path: "/tmp/helm-{{ helm_version }}"
        state: directory
        mode: "0755"
      when:
        - helm_existing_version.rc != 0
          or helm_version not in helm_existing_version.stdout

    # ---------------------------------------------------------
    # Extract Helm
    # ---------------------------------------------------------

    - name: "Helm | Extract Helm archive"
      ansible.builtin.unarchive:
        src: "{{ helm_archive_path }}"
        dest: "/tmp/helm-{{ helm_version }}"
        remote_src: true
      when:
        - helm_existing_version.rc != 0
          or helm_version not in helm_existing_version.stdout

    # ---------------------------------------------------------
    # Install Helm binary
    # ---------------------------------------------------------

    - name: "Helm | Install Helm binary"
      ansible.builtin.copy:
        src: "/tmp/helm-{{ helm_version }}/linux-{{ helm_architecture }}/helm"
        dest: "{{ helm_binary_path }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      when:
        - helm_existing_version.rc != 0
          or helm_version not in helm_existing_version.stdout

    # ---------------------------------------------------------
    # Verify Helm
    # ---------------------------------------------------------

    - name: "Helm | Verify installation"
      ansible.builtin.command:
        cmd: "{{ helm_binary_path }} version --short"
      register: helm_installed_version
      changed_when: false

    - name: "Helm | Display installed version"
      ansible.builtin.debug:
        msg: "Installed Helm version: {{ helm_installed_version.stdout }}"
