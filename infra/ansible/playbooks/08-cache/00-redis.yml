# ---------------------------------------------------------
# 08-00-redis.yml
# Path:
#   infra/ansible/playbooks/08-cache/00-redis.yml
#
# Purpose:
#   Install Redis for Laravel cache, sessions and queues.
#
# Targets:
#   k8s-1
#
# Architecture:
#
#   Laravel
#      │
#      ├── Cache
#      ├── Session
#      └── Queue
#            │
#            ▼
#          Redis
#            │
#            ▼
#         Longhorn
#
# Namespace:
#   cache
#
# Storage:
#   Longhorn
#
# Important:
#   Redis is deployed as a single persistent instance for now.
#   HA Redis will only be introduced if the application
#   requirements justify it.
# ---------------------------------------------------------

# ---------------------------------------------------------
# 08-00-redis.yml
# Path:
#   infra/ansible/playbooks/08-cache/00-redis.yml
#
# Purpose:
#   Install Redis using the Bitnami Helm chart.
#
# Targets:
#   k8s-1
#
# Namespace:
#   cache
#
# Storage:
#   Longhorn
#
# Persistence:
#   Enabled
#
# Authentication:
#   Existing Kubernetes Secret: redis
# ---------------------------------------------------------

- name: "Redis | Install Redis"
  hosts: k8s-1
  become: false
  gather_facts: false

  vars:

    redis_namespace: "cache"
    redis_release: "redis"
    redis_chart: "oci://registry-1.docker.io/bitnamicharts/redis"
    redis_chart_version: "28.3.1"

  tasks:

    # -----------------------------------------------------
    # Install / upgrade Redis
    # -----------------------------------------------------

    - name: "Redis | Install Helm chart"
      ansible.builtin.command:
        cmd: >
          helm upgrade --install {{ redis_release }}
          {{ redis_chart }}
          --namespace {{ redis_namespace }}
          --create-namespace
          --version {{ redis_chart_version }}
          --set architecture=standalone
          --set auth.enabled=true
          --set auth.existingSecret=redis
          --set auth.existingSecretPasswordKey=redis-password
          --set master.persistence.enabled=true
          --set master.persistence.storageClass=longhorn
          --set master.persistence.size=1Gi
          --wait
          --timeout 15m
      register: redis_helm
      changed_when: true

    # -----------------------------------------------------
    # Verify Redis
    # -----------------------------------------------------

    - name: "Redis | Wait for Redis deployment"
      ansible.builtin.command:
        cmd: >
          kubectl -n {{ redis_namespace }}
          rollout status statefulset/{{ redis_release }}-master
          --timeout=15m
      changed_when: false

    - name: "Redis | Show Redis resources"
      ansible.builtin.command:
        cmd: >
          kubectl -n {{ redis_namespace }}
          get pods,pvc,svc
      register: redis_resources
      changed_when: false

    - name: "Redis | Display resources"
      ansible.builtin.debug:
        var: redis_resources.stdout_lines
