---
# 00-containerd.yml
# Install and configure containerd as the Kubernetes container runtime.
#
# Target:
# - control_plane
# - worker
#
# Excluded:
# - load_balancer

- name: Install and configure containerd
  hosts: "control_plane:worker"
  become: true
  gather_facts: true

  tasks:

    # Install containerd from Ubuntu repositories.
    - name: Install containerd
      ansible.builtin.apt:
        name: containerd
        state: present
        update_cache: true

    # Create the default containerd configuration.
    - name: Ensure containerd configuration directory exists
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: "0755"

    - name: Generate containerd configuration
      ansible.builtin.shell:
        cmd: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    # Kubernetes requires the systemd cgroup driver.
    - name: Configure systemd cgroup driver
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    # Restart containerd after configuration changes.
    - name: Enable and restart containerd
      ansible.builtin.systemd:
        name: containerd
        enabled: true
        state: restarted

    # Verify that containerd is running.
    - name: Verify containerd service
      ansible.builtin.systemd:
        name: containerd
        state: started
