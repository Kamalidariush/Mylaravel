---
# ---------------------------------------------------------
# 02-s3-secret.yml
# Path:
#   infra/ansible/playbooks/09-object-storage/02-s3-secret.yml
#
# Purpose:
#   Configure SeaweedFS S3 authentication.
#
# Targets:
#   k8s-1
#
# Namespace:
#   object-storage
#
# Resources:
#   Secret
#   S3Identity
#   S3Credentials
#
# Authentication:
#   Access Key + Secret Key
#
# Security:
#   Credentials are generated inside the cluster.
#   No credential value is stored in Git.
#
# Architecture:
#   Laravel
#      |
#      | S3 API
#      v
#   seaweedfs-s3:8333
#      |
#      v
#   SeaweedFS IAM
#      |
#      v
#   S3Identity / S3Credentials
#
# Important:
#   The Secret is created only if it does not already exist.
#   Existing credentials are preserved.
# ---------------------------------------------------------

- name: "SeaweedFS S3 | Configure authentication"
  hosts: k8s-1
  become: false
  gather_facts: false

  vars:
    seaweedfs_namespace: "object-storage"
    seaweedfs_cluster: "seaweedfs"

    s3_identity: "laravel"
    s3_credentials: "laravel-s3-credentials"
    s3_secret: "laravel-s3-secret"

  tasks:

    # -------------------------------------------------------
    # Generate the Kubernetes Secret only once.
    # -------------------------------------------------------

    - name: "SeaweedFS S3 | Check credentials Secret"
      ansible.builtin.command:
        cmd: >
          kubectl -n {{ seaweedfs_namespace }}
          get secret {{ s3_secret }}
      register: s3_secret_check
      changed_when: false
      failed_when: false

    - name: "SeaweedFS S3 | Generate credentials Secret"
      ansible.builtin.shell:
        cmd: |
          ACCESS_KEY="laravel$(openssl rand -hex 8)"
          SECRET_KEY="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 40)"

          kubectl -n {{ seaweedfs_namespace }} create secret generic {{ s3_secret }} \
            --from-literal=accessKey="${ACCESS_KEY}" \
            --from-literal=secretKey="${SECRET_KEY}"
      when: s3_secret_check.rc != 0
      no_log: true

    # -------------------------------------------------------
    # Create the SeaweedFS IAM identity.
    # -------------------------------------------------------

    - name: "SeaweedFS S3 | Create IAM identity"
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: seaweed.seaweedfs.com/v1
          kind: S3Identity
          metadata:
            name: {{ s3_identity }}
            namespace: {{ seaweedfs_namespace }}
          spec:
            seaweedRef:
              name: {{ seaweedfs_cluster }}

    # -------------------------------------------------------
    # Connect credentials Secret to the IAM identity.
    # -------------------------------------------------------

    - name: "SeaweedFS S3 | Create credentials resource"
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: seaweed.seaweedfs.com/v1
          kind: S3Credentials
          metadata:
            name: {{ s3_credentials }}
            namespace: {{ seaweedfs_namespace }}
          spec:
            seaweedRef:
              name: {{ seaweedfs_cluster }}
            identityRef:
              name: {{ s3_identity }}
            secretRef:
              name: {{ s3_secret }}

    # -------------------------------------------------------
    # Wait until credentials are reconciled.
    # -------------------------------------------------------

    - name: "SeaweedFS S3 | Wait for credentials"
      ansible.builtin.shell:
        cmd: |
          kubectl -n {{ seaweedfs_namespace }} \
            get s3credentials {{ s3_credentials }} \
            -o jsonpath='{.status.phase}'
      register: s3_credentials_status
      changed_when: false
      retries: 30
      delay: 5
      until: s3_credentials_status.stdout == "Ready"

    # -------------------------------------------------------
    # Verify resources.
    # -------------------------------------------------------

    - name: "SeaweedFS S3 | Show identity"
      ansible.builtin.command:
        cmd: >
          kubectl -n {{ seaweedfs_namespace }}
          get s3identity {{ s3_identity }}
      register: s3_identity_status
      changed_when: false

    - name: "SeaweedFS S3 | Show credentials"
      ansible.builtin.command:
        cmd: >
          kubectl -n {{ seaweedfs_namespace }}
          get s3credentials {{ s3_credentials }}
      register: s3_credentials_output
      changed_when: false

    - name: "SeaweedFS S3 | Show Secret"
      ansible.builtin.command:
        cmd: >
          kubectl -n {{ seaweedfs_namespace }}
          get secret {{ s3_secret }}
      register: s3_secret_output
      changed_when: false

    - name: "SeaweedFS S3 | Display status"
      ansible.builtin.debug:
        msg:
          - "{{ s3_identity_status.stdout }}"
          - "{{ s3_credentials_output.stdout }}"
          - "{{ s3_secret_output.stdout }}"
