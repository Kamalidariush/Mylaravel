---
# 00-docker.yml
#
# Prepare the dedicated HAProxy VPS.
#
# Target:
# - haproxy
# - 192.168.1.138
#
# This VPS is NOT a Kubernetes node.
#
# This playbook:
# 1. Updates the package index
# 2. Installs Docker prerequisites
# 3. Adds the official Docker GPG key
# 4. Adds the Docker APT repository
# 5. Installs Docker Engine
# 6. Installs Docker Compose Plugin
# 7. Enables Docker
# 8. Adds the Ansible user to the docker group
#
# IMPORTANT:
# Docker Hub access is restricted in our environment.
# Registry configuration will be handled separately before
# deploying the HAProxy containers.

- name: Prepare dedicated HAProxy VPS
  hosts: load_balancer
  become: true
  gather_facts: true

  tasks:

    # ---------------------------------------------------------
    # STEP 1 - Update APT package index
    # ---------------------------------------------------------

    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    # ---------------------------------------------------------
    # STEP 2 - Install Docker repository prerequisites
    # ---------------------------------------------------------

    - name: Install Docker repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    # ---------------------------------------------------------
    # STEP 3 - Create Docker keyring directory
    # ---------------------------------------------------------

    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    # ---------------------------------------------------------
    # STEP 4 - Install Docker repository signing key
    # ---------------------------------------------------------

    - name: Download Docker repository signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"

    # ---------------------------------------------------------
    # STEP 5 - Configure Docker APT repository
    # ---------------------------------------------------------

    - name: Configure Docker APT repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_architecture == 'x86_64'
          else 'arm64' if ansible_architecture == 'aarch64'
          else ansible_architecture }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    # ---------------------------------------------------------
    # STEP 6 - Install Docker Engine and Compose Plugin
    # ---------------------------------------------------------

    - name: Install Docker Engine and Compose Plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    # ---------------------------------------------------------
    # STEP 7 - Enable Docker service
    # ---------------------------------------------------------

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    # ---------------------------------------------------------
    # STEP 8 - Add Ansible user to Docker group
    # ---------------------------------------------------------

    - name: Add Ansible user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    # ---------------------------------------------------------
    # STEP 9 - Verify Docker installation
    # ---------------------------------------------------------

    - name: Check Docker version
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Show Docker version
      ansible.builtin.debug:
        var: docker_version.stdout

    # ---------------------------------------------------------
    # STEP 10 - Verify Docker Compose
    # ---------------------------------------------------------

    - name: Check Docker Compose version
      ansible.builtin.command:
        cmd: docker compose version
      register: docker_compose_version
      changed_when: false

    - name: Show Docker Compose version
      ansible.builtin.debug:
        var: docker_compose_version.stdout
