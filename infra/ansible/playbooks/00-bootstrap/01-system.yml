---
# 01-system.yml
# Prepare Kubernetes nodes for containerd and Kubernetes.
# The HAProxy node is excluded because it runs separately with Docker Compose.

- name: Prepare Kubernetes nodes
  hosts: "control_plane:worker"
  become: true
  gather_facts: true

  tasks:

    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required system packages
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - vim
          - git
          - ca-certificates
          - gnupg
          - apt-transport-https
          - software-properties-common
          - chrony
        state: present

    - name: Ensure chrony is enabled and running
      ansible.builtin.systemd:
        name: chrony
        enabled: true
        state: started

    - name: Disable swap immediately
      ansible.builtin.command:
        cmd: swapoff -a
      when: ansible_swaptotal_mb | int > 0
      changed_when: true

    - name: Disable swap permanently
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\s*[^#]\S+\s+\S+\s+swap\s+.*)$'
        replace: '# \1'

    - name: Configure Kubernetes kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/kubernetes.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Load overlay kernel module
      ansible.builtin.modprobe:
        name: overlay
        state: present

    - name: Load br_netfilter kernel module
      ansible.builtin.modprobe:
        name: br_netfilter
        state: present

    - name: Configure Kubernetes kernel parameters
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        mode: "0644"
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: Apply kernel parameters
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: true
