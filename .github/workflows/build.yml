name: Build

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  packages: write

jobs:

  build:

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------
      # Checkout exact commit that passed CI
      # -----------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}


      # -----------------------------------------------------
      # Setup Node.js
      # -----------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      # -----------------------------------------------------
      # Install frontend dependencies
      # -----------------------------------------------------

      - name: Install frontend dependencies
        run: npm ci


      # -----------------------------------------------------
      # Build frontend assets
      # -----------------------------------------------------

      - name: Build frontend
        run: npm run build


      # -----------------------------------------------------
      # Verify frontend build output
      # -----------------------------------------------------

      - name: Verify frontend build
        run: |
          test -f public/build/manifest.json
          test -n "$(find public/build/assets -type f | head -n 1)"
          echo "Frontend build verified successfully"
          find public/build -maxdepth 2 -type f


      # -----------------------------------------------------
      # Login to GHCR
      # -----------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # -----------------------------------------------------
      # Build APP image
      # -----------------------------------------------------

      - name: Build APP image
        run: |
          docker build \
            -t ghcr.io/kamalidariush/mylaravel:${{ github.event.workflow_run.head_sha }} \
            -t ghcr.io/kamalidariush/mylaravel:latest \
            -f Dockerfile .


      # -----------------------------------------------------
      # Build NGINX image
      # -----------------------------------------------------

      - name: Build NGINX image
        run: |
          docker build \
            -t ghcr.io/kamalidariush/mylaravel-nginx:${{ github.event.workflow_run.head_sha }} \
            -t ghcr.io/kamalidariush/mylaravel-nginx:latest \
            -f docker/nginx/Dockerfile .


      # -----------------------------------------------------
      # Push APP image
      # -----------------------------------------------------

      - name: Push APP image
        run: |
          docker push ghcr.io/kamalidariush/mylaravel:${{ github.event.workflow_run.head_sha }}
          docker push ghcr.io/kamalidariush/mylaravel:latest


      # -----------------------------------------------------
      # Push NGINX image
      # -----------------------------------------------------

      - name: Push NGINX image
        run: |
          docker push ghcr.io/kamalidariush/mylaravel-nginx:${{ github.event.workflow_run.head_sha }}
          docker push ghcr.io/kamalidariush/mylaravel-nginx:latest