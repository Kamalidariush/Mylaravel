name: Build

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  packages: write

jobs:

  build:

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------
      # Checkout
      # -----------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

        with:
          ref: ${{ github.event.workflow_run.head_sha }}


      # -----------------------------------------------------
      # Login to GHCR
      # -----------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3

        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # -----------------------------------------------------
      # Build APP image
      # -----------------------------------------------------

      - name: Build APP image
        run: |
          docker build \
            -t ghcr.io/kamalidariush/mylaravel:${{ github.event.workflow_run.head_sha }} \
            -t ghcr.io/kamalidariush/mylaravel:latest \
            -f Dockerfile .


      # -----------------------------------------------------
      # Build NGINX image
      # -----------------------------------------------------

      - name: Build NGINX image
        run: |
          docker build \
            -t ghcr.io/kamalidariush/mylaravel-nginx:${{ github.event.workflow_run.head_sha }} \
            -t ghcr.io/kamalidariush/mylaravel-nginx:latest \
            -f docker/nginx/Dockerfile .


      # -----------------------------------------------------
      # Push APP image
      # -----------------------------------------------------

      - name: Push APP image
        run: |
          docker push ghcr.io/kamalidariush/mylaravel:${{ github.event.workflow_run.head_sha }}
          docker push ghcr.io/kamalidariush/mylaravel:latest


      # -----------------------------------------------------
      # Push NGINX image
      # -----------------------------------------------------

      - name: Push NGINX image
        run: |
          docker push ghcr.io/kamalidariush/mylaravel-nginx:${{ github.event.workflow_run.head_sha }}
          docker push ghcr.io/kamalidariush/mylaravel-nginx:latest