name: Monitoring

on:
  push:
    branches:
      - main
    paths:
      - docker-compose.monitoring.yml
      - docker/monitoring/**
      - scripts/monitoring/**
      - .github/workflows/monitoring.yml

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-monitoring:
    name: Deploy Monitoring
    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------
      # Checkout
      # -------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # -------------------------------------------------
      # Validate Monitoring Compose
      # -------------------------------------------------

      # - name: Validate Monitoring Compose
      #   run: |
      #     docker compose \
      #       -p myproject-monitoring \
      #       -f docker-compose.monitoring.yml \
      #       config -q


      # -------------------------------------------------
      # Verify Monitoring Files
      # -------------------------------------------------

      # - name: Verify Monitoring Files
      #   shell: bash
      #   run: |
      #     set -euxo pipefail

      #     echo "PWD:"
      #     pwd

      #     echo ""
      #     echo "Git status:"
      #     git status --short

      #     echo ""
      #     echo "Checking required files..."

      #     test -f "./docker-compose.monitoring.yml"
      #     test -d "./docker/monitoring"
      #     test -f "./scripts/monitoring/deploy.sh"

      #     echo ""
      #     echo "Monitoring files:"

