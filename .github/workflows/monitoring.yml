      #     ls -l "./scripts/monitoring/deploy.sh"

      #     echo ""
      #     echo "Monitoring files verified successfully."


      # -------------------------------------------------
      # Upload Monitoring Files
      # -------------------------------------------------

      - name: Upload Monitoring Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: 1256

          source: "docker-compose.monitoring.yml,docker/monitoring,scripts/monitoring/deploy.sh"

          target: "/opt/myproject/"

          overwrite: true
          debug: true


      # -------------------------------------------------
      # Deploy Monitoring
      # -------------------------------------------------

      - name: Deploy Monitoring
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: 1256

          script: |
            set -Eeuo pipefail

            cd /opt/myproject

            echo "========================================"
            echo "Starting Monitoring Deployment"
            echo "========================================"

            echo ""
            echo "Making deployment script executable..."

            chmod +x scripts/monitoring/deploy.sh

            echo ""
            echo "Running monitoring deployment..."

            bash scripts/monitoring/deploy.sh
