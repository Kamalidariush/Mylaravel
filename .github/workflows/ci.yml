name: CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  # ==================================================
  # 1. TEST
  # ==================================================
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: myproject_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d myproject_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, pdo_pgsql, bcmath, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare environment
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: myproject_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan migrate --force

      - name: Run tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: myproject_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan test


  # ==================================================
  # 2. BUILD DOCKER IMAGE + PUSH GHCR
  # ==================================================
  build:
    name: Docker Build
    needs: test

    # فقط بعد از push/merge به main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kamalidariush/mylaravel:${{ github.sha }}
            ghcr.io/kamalidariush/mylaravel:latest


  # ==================================================
  # 3. DEPLOY TO DEV VPS
  # ==================================================
  deploy:
    name: Deploy DEV
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------
      # Checkout exact commit
      # ----------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # ----------------------------------------------
      # Prepare VPS directories
      # ----------------------------------------------
      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: 1256

          script: |
            set -e

            mkdir -p /opt/myproject/docker/nginx


      # ----------------------------------------------
      # Upload Docker Compose
      # ----------------------------------------------
      - name: Upload Docker Compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: 1256

          source: "docker-compose.yml"
          target: "/opt/myproject"


      # ----------------------------------------------
      # Upload Nginx configuration
      # ----------------------------------------------
      - name: Upload Nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: 1256

          source: "docker/nginx/default.conf"
          target: "/opt/myproject/docker/nginx"


      # ----------------------------------------------
      # Deploy
      # ----------------------------------------------
      - name: Deploy to DEV VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: 1256

          script: |
            set -e

            cd /opt/myproject

            # Exact Docker image for this commit
            export APP_IMAGE=ghcr.io/kamalidariush/mylaravel:${{ github.sha }}

            echo "======================================"
            echo "DEV DEPLOYMENT"
            echo "======================================"

            echo "Commit:"
            echo "${{ github.sha }}"

            echo "Docker Image:"
            echo "$APP_IMAGE"

            echo "======================================"

            echo "Docker version:"
            docker --version

            echo "Docker Compose version:"
            docker compose version

            echo "======================================"
            echo "Pulling images..."
            echo "======================================"

            docker compose pull

            echo "======================================"
            echo "Starting services..."
            echo "======================================"

            docker compose up -d

            echo "======================================"
            echo "Checking APP_KEY..."
            echo "======================================"

            CURRENT_APP_KEY=$(grep '^APP_KEY=' .env | cut -d '=' -f2- || true)

            if [ -z "$CURRENT_APP_KEY" ]; then

              echo "APP_KEY is empty."
              echo "Generating new APP_KEY..."

              NEW_APP_KEY=$(docker compose run --rm app php artisan key:generate --show)

              sed -i "s|^APP_KEY=.*|APP_KEY=$NEW_APP_KEY|" .env

              echo "APP_KEY generated and saved."

            else

              echo "APP_KEY already exists."
              echo "Keeping existing APP_KEY."

            fi

            echo "======================================"
            echo "Restarting application..."
            echo "======================================"

            docker compose up -d

            echo "======================================"
            echo "Running migrations..."
            echo "======================================"

            docker compose run --rm app php artisan migrate --force

            echo "======================================"
            echo "Optimizing Laravel..."
            echo "======================================"

            docker compose exec -T app php artisan optimize

            echo "======================================"
            echo "Container status..."
            echo "======================================"

            docker compose ps

            echo "======================================"
            echo "DEV DEPLOYMENT COMPLETED"
            echo "======================================"