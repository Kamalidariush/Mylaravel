name: CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read
  packages: write


jobs:

  # =========================================================
  # TEST
  # =========================================================
  test:
    name: Test Laravel
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: myproject_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d myproject_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # PHP
      # -------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pgsql, bcmath, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      # -------------------------
      # Node
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # -------------------------
      # Laravel
      # -------------------------
      - name: Prepare environment
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: myproject_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan migrate --force

      - name: Run tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: myproject_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan test


  # =========================================================
  # BUILD
  # =========================================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs:
      - test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # IMPORTANT:
      # This runner is different from the test runner.
      # Therefore public/build must be generated again here.
      # -------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # -------------------------
      # Docker
      # -------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Laravel image
        run: |
          docker build \
            -t ghcr.io/kamalidariush/mylaravel:${{ github.sha }} \
            -t ghcr.io/kamalidariush/mylaravel:latest \
            -f Dockerfile .

      - name: Build Nginx image
        run: |
          docker build \
            -t ghcr.io/kamalidariush/mylaravel-nginx:${{ github.sha }} \
            -t ghcr.io/kamalidariush/mylaravel-nginx:latest \
            -f Dockerfile.nginx .

      - name: Push Laravel image
        run: |
          docker push ghcr.io/kamalidariush/mylaravel:${{ github.sha }}
          docker push ghcr.io/kamalidariush/mylaravel:latest

      - name: Push Nginx image
        run: |
          docker push ghcr.io/kamalidariush/mylaravel-nginx:${{ github.sha }}
          docker push ghcr.io/kamalidariush/mylaravel-nginx:latest


  # =========================================================
  # DEPLOY DEV
  # =========================================================
  deploy:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    needs:
      - build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Upload only docker-compose
      # Nginx config is already inside Nginx image.
      # -------------------------------------------------------
      - name: Upload docker-compose.dev.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: 1256
          source: "docker-compose.dev.yml"
          target: "/opt/myproject"

      # -------------------------------------------------------
      # Deploy
      # -------------------------------------------------------
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ghcr.io/kamalidariush/mylaravel:${{ github.sha }}
          NGINX_IMAGE: ghcr.io/kamalidariush/mylaravel-nginx:${{ github.sha }}
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: 1256

          envs: APP_IMAGE,NGINX_IMAGE

          script: |
            set -e

            cd /opt/myproject

            echo "======================================"
            echo "Deploying commit: ${{ github.sha }}"
            echo "======================================"

            # -------------------------------------------------
            # Check environment
            # -------------------------------------------------
            if [ ! -f .env ]; then
              echo "ERROR: /opt/myproject/.env not found"
              exit 1
            fi

            # -------------------------------------------------
            # Compose variables
            # -------------------------------------------------
            export APP_IMAGE="$APP_IMAGE"
            export NGINX_IMAGE="$NGINX_IMAGE"

            COMPOSE="docker compose -f docker-compose.dev.yml"

            # -------------------------------------------------
            # Validate compose
            # -------------------------------------------------
            echo "Validating Docker Compose..."

            $COMPOSE config -q

            # -------------------------------------------------
            # Pull exact images
            # -------------------------------------------------
            echo "Pulling application image..."
            docker pull "$APP_IMAGE"

            echo "Pulling nginx image..."
            docker pull "$NGINX_IMAGE"

            # -------------------------------------------------
            # Generate APP_KEY only once
            # -------------------------------------------------
            CURRENT_APP_KEY=$(grep '^APP_KEY=' .env | cut -d '=' -f2- || true)

            if [ -z "$CURRENT_APP_KEY" ]; then
              echo "APP_KEY is empty. Generating..."

              NEW_APP_KEY=$(docker run --rm \
                --entrypoint php \
                "$APP_IMAGE" \
                artisan key:generate --show)

              sed -i "s|^APP_KEY=.*|APP_KEY=$NEW_APP_KEY|" .env

              echo "APP_KEY generated."
            else
              echo "APP_KEY already exists. Keeping existing key."
            fi

            # -------------------------------------------------
            # Start containers
            # -------------------------------------------------
            echo "Starting containers..."

            $COMPOSE up -d

            # -------------------------------------------------
            # Database migration
            # -------------------------------------------------
            echo "Running migrations..."

            $COMPOSE exec -T app \
              php artisan migrate --force

            # -------------------------------------------------
            # Laravel optimization
            # -------------------------------------------------
            echo "Optimizing Laravel..."

            $COMPOSE exec -T app \
              php artisan optimize

            # -------------------------------------------------
            # Show status
            # -------------------------------------------------
            echo "======================================"
            echo "Deployment completed."
            echo "======================================"

            $COMPOSE ps