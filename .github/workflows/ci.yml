name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  # =========================================================
  # TEST
  # =========================================================

  test:

    runs-on: ubuntu-latest

    services:

      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: myproject
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d myproject"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5


      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5


    steps:

      # -----------------------------------------------------
      # Checkout
      # -----------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # PHP
      # -----------------------------------------------------

      - name: Setup PHP
        uses: shivammathur/setup-php@v2

        with:
          php-version: "8.3"
          extensions: pdo_pgsql,pgsql,bcmath,zip,mbstring
          coverage: none


      # -----------------------------------------------------
      # Composer
      # -----------------------------------------------------

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader


      # -----------------------------------------------------
      # Node
      # -----------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4

        with:
          node-version: "22"
          cache: npm


      - name: Install NPM dependencies
        run: npm ci


      - name: Build frontend
        run: npm run build


      # -----------------------------------------------------
      # Laravel environment
      # -----------------------------------------------------

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate


      # -----------------------------------------------------
      # Database migrations
      # -----------------------------------------------------

      - name: Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: myproject
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

        run: php artisan migrate --force


      # -----------------------------------------------------
      # Tests
      # -----------------------------------------------------

      - name: Run tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: myproject
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

        run: php artisan test