  deploy:
    name: Deploy to VPS
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: 1256
          source: "docker-compose.dev.yml"
          target: "/opt/myproject"

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.2
        env:
          APP_IMAGE: ghcr.io/kamalidariush/mylaravel:${{ github.sha }}
          NGINX_IMAGE: ghcr.io/kamalidariush/mylaravel-nginx:${{ github.sha }}
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: 1256
          envs: APP_IMAGE,NGINX_IMAGE
          script: |
            set -Eeuo pipefail

            cd /opt/myproject

            COMPOSE="docker compose -f docker-compose.dev.yml"

            echo "========================================"
            echo "Starting deployment"
            echo "APP_IMAGE=$APP_IMAGE"
            echo "NGINX_IMAGE=$NGINX_IMAGE"
            echo "========================================"

            if [ ! -f .env ]; then
              echo "ERROR: /opt/myproject/.env not found"
              exit 1
            fi

            export APP_IMAGE
            export NGINX_IMAGE

            echo "Checking compose configuration..."
            $COMPOSE config -q

            # --------------------------------------------------
            # Save currently running deployment
            # --------------------------------------------------

            PREVIOUS_APP_IMAGE=""
            PREVIOUS_NGINX_IMAGE=""

            if docker inspect myproject-app-1 >/dev/null 2>&1; then
              PREVIOUS_APP_IMAGE=$(
                docker inspect \
                  --format='{{.Config.Image}}' \
                  myproject-app-1
              )
            fi

            if docker inspect myproject-nginx-1 >/dev/null 2>&1; then
              PREVIOUS_NGINX_IMAGE=$(
                docker inspect \
                  --format='{{.Config.Image}}' \
                  myproject-nginx-1
              )
            fi

            if [ -n "$PREVIOUS_APP_IMAGE" ] && [ -n "$PREVIOUS_NGINX_IMAGE" ]; then
              cat > .previous_deployment <<EOF
            APP_IMAGE=$PREVIOUS_APP_IMAGE
            NGINX_IMAGE=$PREVIOUS_NGINX_IMAGE
            EOF

              echo "Previous deployment saved:"
              cat .previous_deployment
            else
              echo "No previous deployment found."
              rm -f .previous_deployment
            fi

            # --------------------------------------------------
            # Health check function
            # --------------------------------------------------

            health_check() {
              echo "Checking application health..."

              for i in $(seq 1 30); do

                if curl -fsS \
                  --max-time 5 \
                  http://127.0.0.1/health/live >/dev/null 2>&1; then

                  echo "Liveness check: OK"
                  break
                fi

                echo "Liveness check failed. Attempt $i/30"
                sleep 2

                if [ "$i" -eq 30 ]; then
                  echo "Liveness check FAILED"
                  return 1
                fi
              done

              for i in $(seq 1 30); do

                if curl -fsS \
                  --max-time 5 \
                  http://127.0.0.1/health/ready >/dev/null 2>&1; then

                  echo "Readiness check: OK"
                  break
                fi

                echo "Readiness check failed. Attempt $i/30"
                sleep 2

                if [ "$i" -eq 30 ]; then
                  echo "Readiness check FAILED"
                  return 1
                fi
              done

              echo "Health checks passed."
              return 0
            }

            # --------------------------------------------------
            # Automatic rollback function
            # --------------------------------------------------

            rollback() {

              echo ""
              echo "========================================"
              echo "AUTOMATIC ROLLBACK"
              echo "========================================"

              if [ ! -f .previous_deployment ]; then
                echo "No previous deployment available."
                echo "Rollback cannot be performed."
                return 1
              fi

              echo "Previous deployment:"
              cat .previous_deployment

              set -a
              source .previous_deployment
              set +a

              echo "Pulling previous application image..."
              docker pull "$APP_IMAGE"

              echo "Pulling previous nginx image..."
              docker pull "$NGINX_IMAGE"

              echo "Starting previous deployment..."

              if ! $COMPOSE up -d; then
                echo "Rollback compose up FAILED"
                return 1
              fi

              echo "Waiting for rollback health checks..."

              if health_check; then
                echo ""
                echo "========================================"
                echo "ROLLBACK SUCCESSFUL"
                echo "========================================"
                return 0
              fi

              echo ""
              echo "========================================"
              echo "ROLLBACK FAILED"
              echo "========================================"

              $COMPOSE ps || true
              $COMPOSE logs --tail=100 || true

              return 1
            }

            # --------------------------------------------------
            # Pull new images
            # --------------------------------------------------

            echo "Pulling new application image..."
            if ! docker pull "$APP_IMAGE"; then
              echo "Failed to pull application image."
              rollback || true
              exit 1
            fi

            echo "Pulling new nginx image..."
            if ! docker pull "$NGINX_IMAGE"; then
              echo "Failed to pull nginx image."
              rollback || true
              exit 1
            fi

            # --------------------------------------------------
            # Generate APP_KEY only if missing
            # --------------------------------------------------

            if ! grep -q '^APP_KEY=.\+' .env; then

              echo "APP_KEY is missing. Generating..."

              NEW_APP_KEY=$(
                docker run --rm \
                  --entrypoint php \
                  "$APP_IMAGE" \
                  artisan key:generate --show
              )

              if [ -z "$NEW_APP_KEY" ]; then
                echo "Failed to generate APP_KEY."
                rollback || true
                exit 1
              fi

              sed -i "s|^APP_KEY=.*|APP_KEY=$NEW_APP_KEY|" .env

              echo "APP_KEY generated successfully."
            fi

            # --------------------------------------------------
            # Start new containers
            # --------------------------------------------------

            echo "Starting new deployment..."

            if ! $COMPOSE up -d; then
              echo "docker compose up FAILED"

              $COMPOSE ps || true
              $COMPOSE logs --tail=100 || true

              rollback || true
              exit 1
            fi

            # --------------------------------------------------
            # Database migration
            # --------------------------------------------------

            echo "Running database migrations..."

            if ! $COMPOSE exec -T app php artisan migrate --force; then

              echo "========================================"
              echo "MIGRATION FAILED"
              echo "========================================"

              $COMPOSE ps || true
              $COMPOSE logs --tail=100 || true

              rollback || true
              exit 1
            fi

            echo "Migration completed successfully."

            # --------------------------------------------------
            # Laravel optimization
            # --------------------------------------------------

            echo "Optimizing Laravel..."

            if ! $COMPOSE exec -T app php artisan optimize; then

              echo "Laravel optimize FAILED"

              $COMPOSE ps || true
              $COMPOSE logs --tail=100 || true

              rollback || true
              exit 1
            fi

            # --------------------------------------------------
            # Health checks
            # --------------------------------------------------

            echo "Running health checks..."

            if ! health_check; then

              echo "Health checks FAILED"

              $COMPOSE ps || true
              $COMPOSE logs --tail=100 || true

              rollback || true
              exit 1
            fi

            # --------------------------------------------------
            # Deployment successful
            # --------------------------------------------------

            cat > .current_deployment <<EOF
            APP_IMAGE=$APP_IMAGE
            NGINX_IMAGE=$NGINX_IMAGE
            EOF

            echo ""
            echo "========================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "========================================"

            echo "Current deployment:"
            cat .current_deployment

            echo ""
            echo "Containers:"
            $COMPOSE ps