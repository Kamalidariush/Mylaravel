name: Deploy

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed

permissions:
  contents: read

jobs:

  deploy:

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------
      # Checkout
      # -----------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

        with:
          ref: ${{ github.event.workflow_run.head_sha }}


      # -----------------------------------------------------
      # Upload deployment files
      # -----------------------------------------------------

      - name: Upload deployment files
        uses: appleboy/scp-action@v0.1.7

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 1256

          source: |
            docker-compose.dev.yml
            scripts/deploy/

          target: "/opt/myproject/"


      # -----------------------------------------------------
      # Deploy
      # -----------------------------------------------------

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0

        env:
          APP_IMAGE: ghcr.io/kamalidariush/mylaravel:${{ github.event.workflow_run.head_sha }}
          NGINX_IMAGE: ghcr.io/kamalidariush/mylaravel-nginx:${{ github.event.workflow_run.head_sha }}

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 1256

          envs: APP_IMAGE,NGINX_IMAGE

          script: |

            set -Eeuo pipefail

            echo "========================================"
            echo "Starting deployment"
            echo "========================================"

            cd /opt/myproject

            echo ""
            echo "APP_IMAGE=${APP_IMAGE}"
            echo "NGINX_IMAGE=${NGINX_IMAGE}"

            echo ""
            echo "Running deployment script..."

            bash scripts/deploy/deploy.sh